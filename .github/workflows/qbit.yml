name: Build qBittorrent 4.3.9 Multi-Platform

on:
  workflow_dispatch:

env:
  QBT_VERSION: "4.3.9"
  QBT_TAG: "release-4.3.9"
  LIBTORRENT_VERSION: "1.2.20"
  LIBTORRENT_TAG: "v1.2.20"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            runner: ubuntu-22.04

          - name: arm64
            runner: ubuntu-22.04-arm

    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.name }}-qt5

    steps:
      - name: Update APT
        run: sudo apt-get update -qq

      - name: Install dependencies
        run: |
          sudo apt-get install -y \
            cmake ninja-build git curl pkg-config python3 \
            libssl-dev zlib1g-dev \
            libboost-dev libboost-system-dev libboost-chrono-dev libboost-random-dev \
            qtbase5-dev qttools5-dev qttools5-dev-tools libqt5svg5-dev

      - name: Set Qt5 path
        run: |
          echo "Qt5_DIR=/usr/lib/x86_64-linux-gnu/cmake/Qt5" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=/usr/lib/x86_64-linux-gnu/cmake" >> $GITHUB_ENV

      - name: Clone libtorrent
        uses: actions/checkout@v4
        with:
          repository: arvidn/libtorrent
          ref: ${{ env.LIBTORRENT_TAG }}
          path: libtorrent
          submodules: recursive

      - name: Build libtorrent
        working-directory: libtorrent
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/sysroot \
            -Dpython-bindings=OFF \
            -Dexamples=OFF \
            -Dtests=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build build --parallel $(nproc)
          cmake --install build

      - name: Clone qBittorrent
        uses: actions/checkout@v4
        with:
          repository: qbittorrent/qBittorrent
          ref: ${{ env.QBT_TAG }}
          path: qbittorrent

      - name: Replace webui file
        run: |
          curl -fsSL https://raw.githubusercontent.com/qbittorrent/qBittorrent/master/src/webui/webapplication.cpp \
            -o qbittorrent/src/webui/webapplication.cpp
          curl -fsSL https://raw.githubusercontent.com/qbittorrent/qBittorrent/master/src/webui/webapplication.h \
            -o qbittorrent/src/webui/webapplication.h

      - name: Configure qBittorrent
        working-directory: qbittorrent
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/dist \
            -DCMAKE_PREFIX_PATH="${{ env.CMAKE_PREFIX_PATH }};${{ github.workspace }}/sysroot" \
            -DQt5_DIR=${{ env.Qt5_DIR }} \
            -DSTACKTRACE=OFF \
            -DWEBUI=ON \
            -DGUI=OFF

      - name: Build
        working-directory: qbittorrent
        run: cmake --build build --parallel $(nproc)

      - name: Collect binary
        run: |
          mkdir -p artifacts
          BIN=$(find qbittorrent/build -type f -name "qbittorrent-nox" | head -1)
          strip "$BIN" || true
          cp "$BIN" "artifacts/${{ matrix.name }}-qbittorrent-nox"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-qbittorrent-nox
          path: artifacts/
