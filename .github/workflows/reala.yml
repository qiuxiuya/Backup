name: Build Reala Static
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: |
          wget https://more.musl.cc/11.2.1/aarch64-linux-musl-cross.tgz
          tar -xf aarch64-linux-musl-cross.tgz
          sudo mv aarch64-linux-musl-cross /opt/aarch64-musl
          echo "/opt/aarch64-musl/bin" >> $GITHUB_PATH

      - run: |
          mkdir -p .cargo
          echo "[target.aarch64-unknown-linux-musl]" > .cargo/config.toml
          echo 'linker = "aarch64-linux-musl-gcc"' >> .cargo/config.toml
          echo 'ar = "aarch64-linux-musl-ar"' >> .cargo/config.toml
          echo "[target.x86_64-unknown-linux-musl]" >> .cargo/config.toml
          echo 'linker = "musl-gcc"' >> .cargo/config.toml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: git clone https://github.com/hanyu-dev/reala-legacy reala-src

      - working-directory: reala-src
        run: cargo build --release --target ${{ matrix.target }}

      - run: |
          mkdir -p reala
          cp reala-src/target/${{ matrix.target }}/release/reala reala/reala-${{ matrix.target }}

      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add reala
          git commit -m "update static binaries" || true
          git push --force
