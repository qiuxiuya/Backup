name: Clean GitHub Actions History

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  cleanup-runs:
    runs-on: ubuntu-latest
    steps:
      - name: List all workflow runs
        id: list
        uses: actions/github-script@v7
        with:
          script: |
            const workflow_id = process.env.WORKFLOW_NAME || "all"; // 可以指定 workflow 名称
            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            const sortedRuns = runs.data.workflow_runs.sort((a,b) => new Date(a.created_at) - new Date(b.created_at));

            const toDelete = sortedRuns.slice(0, -1).map(r => r.id);
            return JSON.stringify(toDelete);
          result-encoding: string

      - name: Delete old workflow runs
        run: |
          echo '${{ steps.list.outputs.result }}' > runs.json
          for run_id in $(jq -r '.[]' runs.json); do
            echo "Deleting run $run_id"
            curl -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              https://api.github.com/repos/${{ github.repository }}/actions/runs/$run_id
          done
