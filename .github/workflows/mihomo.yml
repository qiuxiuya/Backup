name: Download mihomo Releases

on:
  workflow_dispatch:

jobs:
  download-mihomo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Get latest release assets
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const release = await github.rest.repos.getLatestRelease({
              owner: 'MetaCubeX',
              repo: 'mihomo'
            });
            // 输出所有 assets 的 name 和下载链接
            const assets = release.data.assets.map(a => ({name: a.name, url: a.browser_download_url}));
            return JSON.stringify(assets);
          result-encoding: string

      - name: Prepare download list
        run: |
          mkdir -p mihomo
          echo '${{ steps.release.outputs.result }}' > assets.json
          # 指定平台关键字
          platforms=("windows-amd64-compatible" "windows-arm64" "amd64-compatible" "linux-arm64" "linux-armv7" "android-arm64" "android-armv7" "android-amd64")
          > download_urls.txt
          for p in "${platforms[@]}"; do
            jq -r ".[] | select(.name | test(\"$p\")) | .url" assets.json >> download_urls.txt
          done
          # 额外下载固定文件
          jq -r '.[] | select(.name=="mihomo-linux-amd64-compatible-v1.19.19.gz") | .url' assets.json >> download_urls.txt

      - name: Download assets
        run: |
          while read url; do
            wget -P mihomo "$url"
          done < download_urls.txt

      - name: Rename files to remove version
        run: |
          for f in mihomo/*.gz; do
            new_name=$(echo "$f" | sed -E 's/-v[0-9]+\.[0-9]+\.[0-9]+//')
            mv "$f" "$new_name"
          done

      - name: Commit and push
        run: |
          git add mihomo
          git commit -m "Update mihomo releases"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
