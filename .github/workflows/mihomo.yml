name: Download Mihomo Latest Release

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  download-and-rename:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create mihomo directory
        run: mkdir -p mihomo
      
      - name: Get latest release info
        id: get_release
        run: |
          LATEST_RELEASE=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest)
          echo "tag_name=$(echo $LATEST_RELEASE | jq -r '.tag_name')" >> $GITHUB_OUTPUT
          echo $LATEST_RELEASE | jq -r '.assets[].browser_download_url' > urls.txt
      
      - name: Download and rename files
        run: |
          VERSION="${{ steps.get_release.outputs.tag_name }}"

          declare -A FILE_MAP=(
            ["windows-amd64-compatible"]="mihomo-windows-amd64.zip"
            ["windows-arm64"]="mihomo-windows-arm64.zip"
            ["linux-amd64-compatible"]="mihomo-linux-amd64.gz"
            ["linux-arm64"]="mihomo-linux-arm64.gz"
            ["linux-armv7"]="mihomo-linux-armv7.gz"
            ["android-arm64"]="mihomo-android-arm64.gz"
            ["android-armv7"]="mihomo-android-armv7.gz"
            ["android-amd64"]="mihomo-android-amd64.gz"
          )
          
          declare -A DEB_FILE_MAP=(
            ["linux-amd64-v3"]="mihomo-linux-amd64.deb"
            ["linux-arm64"]="mihomo-linux-arm64.deb"
            ["linux-armv7"]="mihomo-linux-armv7.deb"
          )

          for pattern in "${!FILE_MAP[@]}"; do
            if [[ "${FILE_MAP[$pattern]}" == *.zip ]]; then
              url=$(grep "${pattern}" urls.txt | grep "\.zip$" | head -1)
            else
              url=$(grep "${pattern}" urls.txt | grep "\.gz$" | head -1)
            fi
            
            if [ ! -z "$url" ]; then
              echo "Downloading: $url"
              wget -q "$url" -O "mihomo/${FILE_MAP[$pattern]}"
              echo "✓ Downloaded and renamed to: ${FILE_MAP[$pattern]}"
            else
              echo "⚠ File matching pattern '$pattern' not found"
            fi
          done

          for pattern in "${!DEB_FILE_MAP[@]}"; do
            url=$(grep "${pattern}" urls.txt | grep "\.deb$" | head -1)
            
            if [ ! -z "$url" ]; then
              echo "Downloading: $url"
              wget -q "$url" -O "mihomo/${DEB_FILE_MAP[$pattern]}"
              echo "✓ Downloaded and renamed to: ${DEB_FILE_MAP[$pattern]}"
            else
              echo "⚠ DEB file matching pattern '$pattern' not found"
            fi
          done

          rm -f urls.txt
      
      - name: Check if files changed
        id: check_changes
        run: |
          git add mihomo/
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "Update mihomo to ${{ steps.get_release.outputs.tag_name }}"
          git push
      
      - name: Summary
        run: |
          echo "### Download Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.get_release.outputs.tag_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Files downloaded:**" >> $GITHUB_STEP_SUMMARY
          ls -lh mihomo/ >> $GITHUB_STEP_SUMMARY
