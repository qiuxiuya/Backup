name: Sync OpenList Releases daily

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - env:
          OWNER: OpenListTeam
          REPO: OpenList
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          releases=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/$OWNER/$REPO/releases | jq -r '.[].tag_name')

          for tag in $releases; do
            dir="openlist/$tag"
            mkdir -p "$dir"

            assets=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
              https://api.github.com/repos/$OWNER/$REPO/releases/tags/$tag \
              | jq -r '.assets[].browser_download_url')

            for url in $assets; do
              fname=$(basename "$url")
              target="$dir/$fname"

              if [ -f "$target" ]; then
                continue
              fi

              curl -L -H "Authorization: Bearer $GITHUB_TOKEN" -o "$target" "$url"

              git add "$target"
              git commit -m "Add $tag $fname" || true
              git push origin main

              rm -f "$target"
            done
          done
