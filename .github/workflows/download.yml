name: Fetch frp Release

on:
  workflow_dispatch:

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - run: |
          mkdir -p frp
          rm -rf frp/*

      - env:
          RELEASE_TAG: v0.66.0
          OWNER: fatedier
          REPO: frp
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update && sudo apt-get install -y jq curl
          api="https://api.github.com/repos/$OWNER/$REPO/releases/tags/$RELEASE_TAG"
          assets=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" "$api" | jq -r '.assets[].browser_download_url')
          [ -z "$assets" ] && exit 1
          for url in $assets; do
            curl -L -H "Authorization: Bearer $GITHUB_TOKEN" -o "frp/$(basename "$url")" "$url"
          done

      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add frp
          git commit -m "Update frp v0.66.0" || exit 0
          git push origin main
