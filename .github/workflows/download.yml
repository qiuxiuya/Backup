name: Fetch Termark Release

on:
  workflow_dispatch:

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - run: |
          mkdir -p Termark
          rm -rf Termark/*

      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update && sudo apt-get install -y curl

          urls=(
            "https://f.typesafe.cn/termark/Termark-1.0.35-arm64.dmg"
            "https://f.typesafe.cn/termark/Termark-1.0.35.dmg"
            "https://f.typesafe.cn/termark/Termark-Setup-1.0.35-x64.exe"
            "https://f.typesafe.cn/termark/Termark-1.0.35-portable-x64.zip"
            "https://f.typesafe.cn/termark/Termark-1.0.35.AppImage"
            "https://f.typesafe.cn/termark/termark_1.0.35_amd64.deb"
          )

          for url in "${urls[@]}"; do
            file="Termark/$(basename "$url")"
            curl -L -o "$file" "$url"
          done

      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add Termark
          git commit -m "Update Termark 1.0.35" || exit 0
          git push origin main
